name: TikTok inventory update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and compare quantities without writing to TikTok"
        type: boolean
        default: false
      limit:
        description: "Optional SKU limit for a manual run; 0 means no limit"
        type: number
        default: 0

concurrency:
  group: tiktok-inventory-update
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    environment: shop
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create local env file
        env:
          LIBRI_CUSTOMER_NUMBER: ${{ secrets.LIBRI_CUSTOMER_NUMBER }}
          LIBRI_USERNAME: ${{ secrets.LIBRI_USERNAME }}
          LIBRI_PASSWORD: ${{ secrets.LIBRI_PASSWORD }}
          TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_SHOP_CIPHER: ${{ secrets.TIKTOK_SHOP_CIPHER }}
          TIKTOK_WAREHOUSE_ID: ${{ secrets.TIKTOK_WAREHOUSE_ID }}
        run: |
          python - <<'PY'
          import os

          defaults = {
              "TIKTOK_BASE_URL": "https://open-api.tiktokglobalshop.com",
              "TIKTOK_API_VERSION": "202309",
              "TIKTOK_INCLUDE_VERSION": "true",
              "TIKTOK_ACCESS_TOKEN_IN_QUERY": "false",
              "TIKTOK_SIGN_INCLUDE_BODY": "true",
          }
          secret_keys = [
              "LIBRI_CUSTOMER_NUMBER",
              "LIBRI_USERNAME",
              "LIBRI_PASSWORD",
              "TIKTOK_APP_KEY",
              "TIKTOK_APP_SECRET",
              "TIKTOK_ACCESS_TOKEN",
              "TIKTOK_REFRESH_TOKEN",
              "TIKTOK_SHOP_CIPHER",
              "TIKTOK_WAREHOUSE_ID",
          ]

          with open(".env", "w", encoding="utf-8") as env_file:
              for key in secret_keys:
                  env_file.write(f"{key}={os.environ.get(key, '')}\n")
              for key, value in defaults.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Refresh TikTok access token
        run: python scripts/refresh_tiktok_access_token.py --env .env

      - name: Plan inventory changes
        env:
          LIMIT: ${{ inputs.limit || 0 }}
        run: |
          args=(
            "--env" ".env"
            "--output-root" "outputs/inventory_updates"
            "--product-statuses" "ACTIVATE,SELLER_DEACTIVATED"
            "--dry-run"
          )

          if [ "$LIMIT" != "0" ]; then
            args+=("--limit" "$LIMIT")
          fi

          python scripts/update_tiktok_quantities_from_libri.py "${args[@]}"

      - name: Validate inventory plan
        env:
          LIMIT: ${{ inputs.limit || 0 }}
        run: |
          python - <<'PY'
          import csv, os, pathlib

          logs = sorted(pathlib.Path("outputs/inventory_updates").glob("*/inventory_update_log.csv"))
          if not logs:
              raise SystemExit("Inventory preflight produced no audit log.")
          rows = list(csv.DictReader(logs[-1].open(encoding="utf-8-sig")))
          changes = [row for row in rows if row["status"] == "dry_run_update"]
          zeroes = [row for row in changes if row.get("quantity_sent") == "0"]
          failures = [row for row in rows if row["status"].startswith(("failed", "skipped_missing")) or "error" in row["status"]]
          minimum = 1 if int(os.environ.get("LIMIT", "0")) else 50
          print(f"Inventory preflight: resolved={len(rows)} changes={len(changes)} zeroes={len(zeroes)} failures={len(failures)}")
          if len(rows) < minimum:
              raise SystemExit(f"Inventory preflight resolved only {len(rows)} SKUs; expected at least {minimum}.")
          if len(changes) > 30:
              raise SystemExit(f"Inventory preflight would change {len(changes)} SKUs; safety limit is 30.")
          if len(zeroes) > 15:
              raise SystemExit(f"Inventory preflight would set {len(zeroes)} SKUs to zero; safety limit is 15.")
          if failures:
              raise SystemExit(f"Inventory preflight contains {len(failures)} failed or incomplete rows.")
          PY

      - name: Apply inventory changes
        if: github.event_name == 'schedule' || inputs.dry_run != true
        env:
          LIMIT: ${{ inputs.limit || 0 }}
        run: |
          args=(
            "--env" ".env"
            "--output-root" "outputs/inventory_updates"
            "--product-statuses" "ACTIVATE,SELLER_DEACTIVATED"
          )
          if [ "$LIMIT" != "0" ]; then
            args+=("--limit" "$LIMIT")
          fi
          python scripts/update_tiktok_quantities_from_libri.py "${args[@]}"

      - name: Upload inventory update log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-inventory-update-${{ github.run_id }}
          path: outputs/inventory_updates/
          retention-days: 30

      - name: Notify about inventory automation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "TikTok inventory automation failed ($GITHUB_RUN_ID)" \
            --body "The inventory workflow failed. Review the run and its audit artifact: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
