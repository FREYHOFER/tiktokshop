name: TikTok weekly catalog rotation

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and audit the rotation without writing to TikTok"
        type: boolean
        default: true
      replace_count:
        description: "Maximum number of titles to replace"
        type: number
        default: 10

concurrency:
  group: tiktok-weekly-catalog-rotation
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  rotate-catalog:
    runs-on: ubuntu-latest
    environment: shop
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt Pillow

      - name: Create local env file
        env:
          LIBRI_CUSTOMER_NUMBER: ${{ secrets.LIBRI_CUSTOMER_NUMBER }}
          LIBRI_USERNAME: ${{ secrets.LIBRI_USERNAME }}
          LIBRI_PASSWORD: ${{ secrets.LIBRI_PASSWORD }}
          TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_SHOP_CIPHER: ${{ secrets.TIKTOK_SHOP_CIPHER }}
          TIKTOK_WAREHOUSE_ID: ${{ secrets.TIKTOK_WAREHOUSE_ID }}
          TIKTOK_MANUFACTURER_ID: ${{ secrets.TIKTOK_MANUFACTURER_ID }}
        run: |
          python - <<'PY'
          import os

          defaults = {
              "TIKTOK_BASE_URL": "https://open-api.tiktokglobalshop.com",
              "TIKTOK_API_VERSION": "202309",
              "TIKTOK_INCLUDE_VERSION": "true",
              "TIKTOK_ACCESS_TOKEN_IN_QUERY": "false",
              "TIKTOK_SIGN_INCLUDE_BODY": "true",
          }
          secret_keys = [
              "LIBRI_CUSTOMER_NUMBER",
              "LIBRI_USERNAME",
              "LIBRI_PASSWORD",
              "TIKTOK_APP_KEY",
              "TIKTOK_APP_SECRET",
              "TIKTOK_ACCESS_TOKEN",
              "TIKTOK_REFRESH_TOKEN",
              "TIKTOK_SHOP_CIPHER",
              "TIKTOK_WAREHOUSE_ID",
              "TIKTOK_MANUFACTURER_ID",
          ]

          with open(".env", "w", encoding="utf-8") as env_file:
              for key in secret_keys:
                  env_file.write(f"{key}={os.environ.get(key, '')}\n")
              for key, value in defaults.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Refresh TikTok access token
        run: python scripts/refresh_tiktok_access_token.py --env .env

      - name: Check required catalog compliance configuration
        env:
          TIKTOK_MANUFACTURER_ID: ${{ secrets.TIKTOK_MANUFACTURER_ID }}
        run: |
          if [ -z "$TIKTOK_MANUFACTURER_ID" ]; then
            echo "::error::TIKTOK_MANUFACTURER_ID is missing in the shop environment. Register or select the seller-associated manufacturer in TikTok Seller Center and save its ID as this environment secret."
            exit 1
          fi

      - name: Collect current Libri new releases
        run: |
          python scripts/collect_libri_candidates.py \
            --env .env \
            --output outputs/weekly_catalog_rotation/libri_new_releases.csv \
            --limit 100 \
            --limit-per-source 20 \
            --source-label libri_novitaeten_belletristik_hardcover \
            --source-label libri_novitaeten_belletristik_taschenbuch \
            --source-label libri_novitaeten_krimi \
            --source-label libri_novitaeten_scifi_fantasy \
            --source-label libri_novitaeten_kinder_jugendbuch

      - name: Fetch Libri product pages
        run: |
          python scripts/fetch_libri_product_pages.py \
            --env .env \
            --isbn-csv outputs/weekly_catalog_rotation/libri_new_releases.csv \
            --output-dir outputs/weekly_catalog_rotation/libri_pages \
            --limit 100 \
            --retries 4 \
            --session-refresh-every 10

      - name: Build checked TikTok upload workbook
        run: |
          python scripts/tiktok_libri_pipeline.py \
            --workspace . \
            --detail-glob "outputs/weekly_catalog_rotation/libri_pages/*.html" \
            --bestseller-pdf none.pdf \
            --manual-csv outputs/weekly_catalog_rotation/libri_new_releases.csv \
            --output-dir outputs/weekly_catalog_rotation/upload_pack \
            --limit 30

      - name: Plan catalog rotation
        id: plan
        env:
          REPLACE_COUNT: ${{ inputs.replace_count || 10 }}
        run: |
          if [ "$REPLACE_COUNT" -gt 3 ]; then REPLACE_COUNT=3; fi
          args=(
            "--env" ".env"
            "--new-workbook" "outputs/weekly_catalog_rotation/upload_pack/tiktok_upload_green.xlsx"
            "--output-root" "outputs/catalog_rotation"
            "--replace-count" "$REPLACE_COUNT"
            "--save-mode" "LISTING"
            "--retire-stock-threshold" "0"
            "--retire-product-statuses" "ACTIVATE"
            "--max-scan-pages" "10"
            "--max-scan-skus" "500"
            "--libri-retries" "4"
            "--libri-session-refresh-every" "10"
            "--stop-on-error"
          )
          python scripts/rotate_tiktok_catalog.py "${args[@]}"

          python - <<'PY'
          import csv, pathlib, os

          logs = sorted(pathlib.Path("outputs/catalog_rotation").glob("*/catalog_rotation_log.csv"))
          if not logs:
              raise SystemExit("Catalog preflight produced no audit log.")
          rows = list(csv.DictReader(logs[-1].open(encoding="utf-8-sig"), delimiter=";"))
          creates = [row for row in rows if row["status"] == "planned_create"]
          retires = [row for row in rows if row["status"] == "planned_zero_inventory"]
          failures = [row for row in rows if row["status"] == "failed" or "error" in row["status"]]
          print(f"Catalog preflight: creates={len(creates)} retires={len(retires)} failures={len(failures)}")
          if failures:
              raise SystemExit(f"Catalog preflight contains {len(failures)} failures.")
          if len(creates) != len(retires):
              raise SystemExit("Catalog preflight does not have balanced create/retire pairs.")
          if len(creates) > 3:
              raise SystemExit("Catalog preflight exceeds the live safety limit of three pairs.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if creates else 'false'}\n")
              output.write(f"pair_count={len(creates)}\n")
          PY

      - name: Apply live catalog rotation
        if: steps.plan.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.dry_run != true)
        env:
          PAIR_COUNT: ${{ steps.plan.outputs.pair_count }}
        run: |
          python scripts/rotate_tiktok_catalog.py \
            --env .env \
            --new-workbook outputs/weekly_catalog_rotation/upload_pack/tiktok_upload_green.xlsx \
            --output-root outputs/catalog_rotation \
            --replace-count "$PAIR_COUNT" \
            --save-mode LISTING \
            --retire-stock-threshold 0 \
            --retire-product-statuses ACTIVATE \
            --max-scan-pages 10 \
            --max-scan-skus 500 \
            --libri-retries 4 \
            --libri-session-refresh-every 10 \
            --live \
            --stop-on-error

      - name: Upload rotation audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-weekly-catalog-rotation-${{ github.run_id }}
          path: |
            outputs/weekly_catalog_rotation/libri_new_releases.csv
            outputs/weekly_catalog_rotation/upload_pack/
            outputs/catalog_rotation/
          retention-days: 30

      - name: Notify about catalog rotation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "TikTok catalog rotation failed ($GITHUB_RUN_ID)" \
            --body "The live catalog rotation workflow failed. Review the run and its audit artifact: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
